<div class="m-5 mt-3">
  <p-tabs [value]="tab" (valueChange)="onTabChange($event)">
    <div class="flex items-center justify-between gap-4">
      <p-tablist>
        <p-tab value="compressor">Compressor</p-tab>
        <p-tab value="dispenser">Dispenser</p-tab>
      </p-tablist>
      <button (click)="createAlarm()"
        class="bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition cursor-pointer shrink-0">
        Create {{ tab === 'compressor' ? 'Compressor' : 'Dispenser' }} Rule
      </button>
    </div>

    <p-tabpanels class="!bg-transparent !px-0">
      <p-tabpanel value="compressor">
        @if (visited.has('compressor')) {
        <app-rules-list source="compressor"></app-rules-list>
        }
      </p-tabpanel>
      <p-tabpanel value="dispenser">
        @if (visited.has('dispenser')) {
        <app-rules-list source="dispenser"></app-rules-list>
        }
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
