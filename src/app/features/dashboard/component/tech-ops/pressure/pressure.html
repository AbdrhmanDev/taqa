<div class="bg-white p-4 shadow-sm rounded-2xl">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">{{ station?.stationName }}</h1>
    <p class="text-sm text-gray-500">Pressure Readings · 6 stages</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-6">
    <div *ngFor="let sensor of stages" class="bg-white rounded-xl shadow p-5 flex flex-col items-center">
      <p class="text-sm font-semibold text-gray-600 mb-2">{{ sensor.label }}</p>

      <svg viewBox="0 0 160 120" class="w-48 h-32">
        <!-- Definition for Gradient -->
        <defs>
          <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#22C55E" />
            <stop offset="50%" stop-color="#EAB308" />
            <stop offset="80%" stop-color="#F97316" />
            <stop offset="100%" stop-color="#EF4444" />
          </linearGradient>
        </defs>

        <!-- Background Arc with Gradient -->
        <path [attr.d]="describeArc(80, 80, 60, -120, 120)" fill="none" stroke="url(#gaugeGradient)" stroke-width="12"
          stroke-linecap="round" />

        <!-- Graduation Marks -->
        <line *ngFor="let tick of getTickMarks()" [attr.x1]="tick.x1" [attr.y1]="tick.y1" [attr.x2]="tick.x2"
          [attr.y2]="tick.y2" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />



        <!-- Needle -->
        <g
          [attr.transform]="'rotate(' + (isInvalidValue(sensor.value) ? -120 : getNeedleRotation(sensor.value)) + ', 80, 80)'">
          <line x1="80" y1="80" x2="80" y2="25" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
          <circle cx="80" cy="80" r="6" fill="#1e293b" />
          <circle cx="80" cy="80" r="2" fill="#fff" />
        </g>

        <!-- Labels -->
        <text [attr.x]="polarToCartesian(80, 80, 75, -120).x" [attr.y]="polarToCartesian(80, 80, 75, -120).y"
          font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="bold">
          {{ minPressure | number:'1.2-2' }}
        </text>
        <text [attr.x]="polarToCartesian(80, 80, 75, 120).x" [attr.y]="polarToCartesian(80, 80, 75, 120).y" font-size="8"
          fill="#94a3b8" text-anchor="middle" font-weight="bold">
          {{ maxPressure | number:'1.2-2' }}
        </text>
      </svg>


      <p class="text-2xl font-bold -mt-2" [style.color]="getColor(sensor.value)">
        {{ isInvalidValue(sensor.value) ? 'N/A' : (sensor.value | number:'1.2-2') }}
      </p>
      <p class="text-xs text-gray-400 mt-1">bar</p>
    </div>
  </div>
  <div class="mb-6">
    <!-- <h1 class="text-2xl font-bold text-gray-800">{{ station?.stationName }}</h1> -->
    <p class="text-sm text-gray-500 mt-3">Temperature Readings · 6 stages</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-6">
    <div *ngFor="let sensor of Temp" class="bg-white rounded-xl shadow p-5 flex flex-col items-center gap-2">
      <p class="text-sm font-semibold text-gray-600">{{ sensor.label }}</p>

      <!-- Dynamic Thermometer SVG -->
      <svg width="66" height="121" viewBox="0 0 66 121" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="tube-clip-{{ sensor.label}}">

            <rect x="27" y="35" width="12" height="43" />
          </clipPath>
        </defs>

.219 48.855 102.652 46.4313 104.592V104.155Z"
          fill="#DDDDDD" />

        <rect *ngIf="!isInvalidValues(sensor.value)" x="27.3" [attr.y]="getFillY(sensor.value)" width="11"
          [attr.height]="getFillHeight(sensor.value)" [attr.fill]="getColors(sensor.value)" />

        <circle cx="32.8" cy="87.4" r="10.9"
          [attr.fill]="isInvalidValues(sensor.value) ? '#DDDDDD' : getColors(sensor.value)" />
      </svg>


      <p class="text-2xl font-bold" [style.color]="isInvalidValues(sensor.value) ? '#94a3b8' : getColors(sensor.value)">
        {{ isInvalidValues(sensor.value) ? 'N/A' : (sensor.value | number:'1.2-2') }}
      </p>
      <p class="text-xs text-gray-400">°C</p>
    </div>
  </div>
</div>
