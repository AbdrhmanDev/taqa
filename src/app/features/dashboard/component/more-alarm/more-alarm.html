<div class="m-3 bg-white p-6 rounded-3xl flex flex-col">
  <!-- Header -->
  <div class="flex justify-between items-center pb-4">
    <h3 class="font-bold">Recent Alarms</h3>
    <span class="text-gray-400 text-sm">Total Alarms: {{ totalAlarms }}</span>
  </div>

  <!-- Alarms List -->
  <div class="flex flex-col gap-3">
    <div class="bg-gray-100 p-4 rounded-3xl flex justify-between" *ngFor="let alarm of pagedAlarms">
      <div class="flex">
        <div class="me-2 w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path
              d="M3.39309 6.61077C5.40449 3.05165 6.41019 1.2721 7.79022 0.814009C8.54943 0.561997 9.36724 0.561997 10.1264 0.814009C11.5065 1.2721 12.5122 3.05165 14.5236 6.61077C16.535 10.1699 17.5407 11.9494 17.239 13.3995C17.073 14.1972 16.6641 14.9207 16.0709 15.4664C14.9925 16.4583 12.9811 16.4583 8.95833 16.4583C4.93554 16.4583 2.92414 16.4583 1.8458 15.4664C1.25257 14.9207 0.843658 14.1972 0.677686 13.3995C0.375995 11.9494 1.38169 10.1699 3.39309 6.61077Z"
              stroke="#912018" stroke-width="1.25" />
            <path d="M8.95101 11.875H8.9585" stroke="#912018" stroke-width="1.66667" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M8.95898 9.375L8.95898 6.04167" stroke="#912018" stroke-width="1.25" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <div>
          <h4 class="font-bold text-sm">{{ alarm?.stationName }}</h4>
          <p class="text-gray-400 text-xs pt-1 pb-1">{{ alarm?.className }}</p>
          <p class="font-bold text-sm">{{ alarm?.name }}</p>
          <p class="text-gray-400 text-xs pt-1">{{ alarm?.timeStamp | date:'short' }}</p>
        </div>
      </div>
      <div class="flex flex-col items-end justify-between">
        <p class="text-center text-green-800 px-3 h-6 bg-green-100 rounded-xl text-xs leading-6">Normal</p>
        <div class="flex gap-3">
          <a class="underline text-blue-900 cursor-pointer text-xs">Acknowledge</a>
          <a class="underline text-blue-900 cursor-pointer text-xs">Create Ticket</a>
        </div>
      </div>
    </div>

    <div *ngIf="alarmsHistory.length === 0" class="text-center text-gray-400 py-6">
      No alarms yet...
    </div>
  </div>

  <!-- Pagination -->
  <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-100">
    <button
      class="flex items-center gap-2 px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed transition"
      [disabled]="currentPage === 1" (click)="prevPage()">
      ← Previous
    </button>

    <div class="flex gap-2">
      <button *ngFor="let page of totalPages" (click)="goToPage(page)" class="w-8 h-8 rounded-lg text-sm transition"
        [ngClass]="page === currentPage
          ? 'bg-gray-300 text-black'
          : 'bg-gray-100 text-gray-600 hover:bg-gray-200'">
        {{ page }}
      </button>
    </div>

    <button
      class="flex items-center gap-2 px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed transition"
      [disabled]="currentPage === totalPagesCount" (click)="nextPage()">
      Next →
    </button>
  </div>
</div>
