<div class="flex flex-col lg:flex-row gap-6 m-4 p-6 ">

  <!-- Revenu chart -->
  <div class="w-full lg:w-1/2 bg-white rounded-3xl shadow-sm p-4">
    <h3 class="pb-2 font-bold">Revenue Trend</h3>
    <apx-chart *ngIf="series && chart" [series]="series" [chart]="chart" [dataLabels]="dataLabels" [markers]="markers"
      [title]="title" [fill]="fill" [yaxis]="yaxis" [xaxis]="xaxis" [tooltip]="tooltip" [colors]="colors">
    </apx-chart>
  </div>

  <!-- Gas chart -->
  <div class="w-full lg:w-1/2 bg-white rounded-3xl shadow-sm p-4">
    <h3 class="pb-2 font-bold">Gas Volume Trend</h3>
    <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [dataLabels]="chartOptions.dataLabels"
      [plotOptions]="chartOptions.plotOptions" [yaxis]="chartOptions.yaxis" [xaxis]="chartOptions.xaxis"
      [fill]="chartOptions.fill" [title]="chartOptions.title" [colors]="chartOptions.colors">
    </apx-chart>
  </div>

</div>
