  [draggable]="false" [resizable]="false"> -->

<!-- Trash Icon -->
<div class="flex justify-center items-center mt-4">
  <img class="w-24 h-24" src="../../../../../assets/Images/delete-pic.png" alt="Delete Icon" />
</div>

<!-- Warning Text -->
<div class="text-center mt-4 mb-6">
  <p class="text-lg font-semibold text-gray-800">
    Are you sure you want to delete this item?
  </p>
  <p class="text-sm text-gray-500">
    This action cannot be undone
  </p>
</div>

<!-- Action Buttons -->
<div class="flex justify-between gap-2">
  <button class="bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg hover:bg-gray-400 transition"
    (click)="closePopup()">
    Cancel
  </button>
  <button class="bg-red-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-red-700 transition"
    (click)="userId ? onDeleteUser() : onDeleteRole()">
    Yes, Delete It!
  </button>
</div>
