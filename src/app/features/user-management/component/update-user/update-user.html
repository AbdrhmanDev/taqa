<div class="flex flex-col gap-6 overflow-auto ">

  <!-- Header -->
  <div>
    <h2 class="text-2xl font-semibold text-gray-800">
      Edit ({{ userData?.userName }})
    </h2>
    <hr class="mt-3 border-gray-200">
  </div>

  <!-- Form -->
  <form [formGroup]="editUserForm" class="flex flex-col gap-5 ">

    <input type="hidden" formControlName="userId" />

    <!-- User Name (View Only) -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-gray-600">Name</label>

      <input type="text" [value]="userData?.userName" disabled
        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm bg-gray-100 text-gray-600 cursor-not-allowed" />
    </div>

    <!-- Roles -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-gray-600">Roles</label>

      <p-select [options]="allRoles" appendTo="body" formControlName="roleName" optionLabel="roleName"
        optionValue="roleName" placeholder="Select a role" class="w-full">
      </p-select>
    </div>

  </form>

  <!-- Actions -->
  <div class="flex justify-end gap-4 pt-2">
    <button type="button" class="text-gray-500 hover:text-gray-700" (click)="closePopup()">
      Cancel
    </button>

    <button type="button" (click)="save()"
      class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition cursor-pointer">
      Save
    </button>
  </div>

</div>
