<div class="bg-white rounded-xl shadow-sm p-6 m-5">
  <form [formGroup]="addUserForm" (ngSubmit)="onAddUser()" class="space-y-6">

    <!-- ===== Row 1 ===== -->
    <div class="grid grid-cols-12 gap-6">
      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Name </label>
        <input formControlName="userName" type="text" placeholder="Enter your name"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
      </div>

      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Email
        </label>
        <input formControlName="email" type="text" placeholder="Enter your email"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
      </div>

      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> PhoneNumber
        </label>
        <input formControlName="phoneNumber" type="text" placeholder="Enter your PhoneNumber"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
      </div>

      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Password
        </label>
        <input formControlName="password" type="password" placeholder="Enter your password"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
      </div>
    </div>

    <!-- ===== Row 2 ===== -->
    <div class="grid grid-cols-12 gap-6">
      <div class="col-span-12 md:col-span-3">
        <label class="label">Roles</label>
        <p-select formControlName="roleName" [options]="userType" optionLabel="label" optionValue="value"
          placeholder="Select a role" class="w-full">
        </p-select>
      </div>
    </div>
