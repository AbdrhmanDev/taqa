<div class="bg-white rounded-xl shadow-sm p-6">
  <form class="space-y-6">


    <div class="grid grid-cols-12 gap-6">
      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Name </label>
        <input type="text" placeholder="Enter your name"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
      </div>
      <div class="col-span-12 md:col-span-3">
        <label class="label">Roles</label>
        <p-select optionLabel="label" optionValue="value" placeholder="Select a role" class="w-full">
        </p-select>
      </div>
      <div class="col-span-12">
        <p-editor [style]="{ height: '200px' }" placeholder="Details about user">
        </p-editor>
      </div>

    </div>
    <div class="flex justify-between pt-4">
      <button type="button" class="px-5 py-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">
        Cancel
      </button>

      <button type="submit" class="px-6 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
        Submit
      </button>
    </div>

  </form>
</div>
