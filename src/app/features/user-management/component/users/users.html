<div class="flex justify-end mt-4">
  <button class="m-6 bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition cursor-pointer"
    (click)="handleButtonClick()">

    @switch (currentTab) {
    @case ('0') {
    <span>Add User</span>
    }
    @case ('1') {
    <span>Add Role</span>
    }
    @default {
    <span>Add User</span>
    }
    }
  </button>
</div>
<div class="">
  <div class="card ms-3 me-3 rounded-2xl shadow-sm">
    <p-tabs value="0" (valueChange)="onTabChange($event)">
      <p-tablist>
        <p-tab value="0">User</p-tab>
        <p-tab value="1">Role</p-tab>


      </p-tablist>
      <div class="flex">
        <div class="col-span-12 md:col-span-3 mt-3 ms-3">

          <p-select optionLabel="label" optionValue="value" placeholder="Select a role" class="w-80">
          </p-select>
        </div>
        <div class="mt-3 ms-2">


          <div class="relative">

            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="#979797" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>



            <input type="email" id="Email" placeholder="Search for any info" class="w-80 rounded-lg border border-gray-300 pl-11 pr-4 py-2.5 text-sm
             focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
          </div>
        </div>
      </div>
      <p-tabpanels>
        <p-tabpanel value="0">
          <div class="card">
            <p-table [value]="products" [tableStyle]="{ 'min-width': '50rem' }">

              <ng-template #header>

                <tr>
                  <th>Code</th>
                  <th>Name</th>
                  <th>Id</th>
                  <th>Team</th>
                </tr>
              </ng-template>
              <ng-template #body let-product>
                <tr>
                  <td>{{ product.code }}</td>
                  <td>{{ product.name }}</td>
                  <td>{{ product.id }}</td>
                  <td>{{ product.team }}</td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </p-tabpanel>
        <p-tabpanel value="1">
          <div class="card">
            <p-table [value]="roles" [tableStyle]="{ 'min-width': '50rem' }">
              <ng-template #header>
                <tr>
                  <th>Code</th>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Claims</th>

                </tr>
              </ng-template>
              <ng-template #body let-roles>
                <tr>
                  <td>{{ roles.id }}</td>
                  <td>{{ roles.name }}</td>
                  <td>{{ roles.role }}</td>
                  <td>{{ roles.claims }}</td>

                </tr>
              </ng-template>
            </p-table>
          </div>

        </p-tabpanel>

      </p-tabpanels>
    </p-tabs>
  </div>
</div>
