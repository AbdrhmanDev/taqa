<div class="flex justify-end mt-4">
  <button class="m-6 bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition cursor-pointer"
    (click)="handleButtonClick()">

    @switch (currentTab) {
    @case ('0') {
    <span>Add User</span>
    }
    @case ('1') {
    <span>Add Role</span>
    }
    @default {
    <span>Add User</span>
    }
    }
  </button>
</div>
<div class="">
  <div class="card ms-3 me-3 rounded-2xl shadow-sm">
    <p-tabs value="0" (valueChange)="onTabChange($event)">
      <p-tablist>
        <p-tab value="0">User</p-tab>
        <p-tab value="1">Role</p-tab>


      </p-tablist>
      <div class="flex">
        <!-- <div class="col-span-12 md:col-span-3 mt-3 ms-3">

          <p-select formControlName="roleName" [options]="allUsers" optionLabel="label" optionValue="value"
            placeholder="Select a role" class="w-full">
          </p-select>
        </div> -->
        <div class="mt-3 ms-2">


          <div class="relative">

            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="#979797" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>


            @if(currentTab == '0' ){
            <input type="email" id="Email" placeholder="Search by email" class="w-80 rounded-lg border border-gray-300 pl-11 pr-4 py-2.5 text-sm
             focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
            }@else {
            <input type="text" id="role" placeholder="Search by Role" class="w-80 rounded-lg border border-gray-300 pl-11 pr-4 py-2.5 text-sm
             focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
            }

          </div>
        </div>
      </div>
      <p-tabpanels>
        <p-tabpanel value="0">
          <div class="card">
            <p-table [value]="allUsers" [tableStyle]="{ 'min-width': '50rem' }">

              <ng-template #header>

                <tr>
                  <th>UserName</th>
                  <th>Email</th>
                  <th>RoleName</th>
                  <th>PhoneNumber</th>
                  <th>Actions</th>

                </tr>
              </ng-template>
              <ng-template #body let-user>
                <tr>
                  <td>{{ user.userName }}</td>
                  <td>{{ user.email }}</td>
                  <td>{{ user.roleName }}</td>
                  <td>{{ user.phoneNumber }}</td>
                  <td>

                    <button class="p-2 cursor-pointer" (click)="openDelete(user.id)">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path
                          d="M13.1966 4.94752V4.28771C13.1966 3.36388 13.1966 2.90196 13.0169 2.5491C12.8587 2.23872 12.6064 1.98637 12.296 1.82823C11.9431 1.64844 11.4812 1.64844 10.5574 1.64844H9.23774C8.31391 1.64844 7.85199 1.64844 7.49913 1.82823C7.18875 1.98637 6.9364 2.23872 6.77826 2.5491C6.59847 2.90196 6.59847 3.36388 6.59847 4.28771V4.94752M8.24801 9.48377V13.6076M11.5471 9.48377V13.6076M2.47461 4.94752H17.3205M15.671 4.94752V14.185C15.671 15.5707 15.671 16.2636 15.4013 16.7929C15.1641 17.2584 14.7855 17.637 14.32 17.8742C13.7907 18.1439 13.0978 18.1439 11.7121 18.1439H8.08306C6.69731 18.1439 6.00444 18.1439 5.47515 17.8742C5.00958 17.637 4.63106 17.2584 4.39384 16.7929C4.12415 16.2636 4.12415 15.5707 4.12415 14.185V4.94752"
                          stroke="#B42318" stroke-width="1.64954" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                    </button>

                    <p-dialog [(visible)]="showdeletePopup" header="Delete User" [modal]="true"
                      [style]="{ width: '20vw' }" [closable]="true" [draggable]="false" [resizable]="false">

                      <app-delete-user [userId]="selectedUserId" (close)="showdeletePopup = false"
                        (deletedUser)="onGetAllUsers()"></app-delete-user>

                    </p-dialog>
                    <button class="p-2 cursor-pointer" (click)="openEditUser(user)">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path
                          d="M2.37265 14.9393C2.41054 14.5982 2.42949 14.4277 2.48108 14.2683C2.52686 14.1269 2.59154 13.9924 2.67336 13.8683C2.76558 13.7284 2.8869 13.6071 3.12953 13.3645L14.0217 2.47232C14.9327 1.56131 16.4098 1.56131 17.3208 2.47233C18.2318 3.38334 18.2318 4.8604 17.3208 5.77141L6.42862 16.6636C6.18598 16.9062 6.06467 17.0275 5.92481 17.1197C5.80073 17.2016 5.66617 17.2662 5.52476 17.312C5.36538 17.3636 5.19487 17.3826 4.85383 17.4205L2.0625 17.7306L2.37265 14.9393Z"
                          stroke="#475467" stroke-width="1.64954" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                    </button>

                    <p-dialog [(visible)]="showEditPopup" header="Edit User" [modal]="true"
                      [style]="{ width: '30vw',  }" [closable]="true" [draggable]="false" [resizable]="false">

                      <app-update-user (updatedUser)="onGetAllUsers()" [userData]="selectedUserRole"
                        (close)="showEditPopup = false"></app-update-user>

                    </p-dialog>



                  </td>


                </tr>
              </ng-template>
            </p-table>
          </div>
        </p-tabpanel>
        <p-tabpanel value="1">
          <div class="card">
            <p-table [value]="allRoles" [tableStyle]="{ 'min-width': '50rem' }">
              <ng-template #header>
                <tr>
                  <th>RoleName</th>
                  <th>Claims</th>
                  <th>Areas</th>
                  <th>Actions</th>


                </tr>
              </ng-template>
              <ng-template #body let-roles>
                <tr>
                  <td>{{ roles.roleName }}</td>
                  <td>{{ getClaimValues(roles.claims) }}</td>
                  <td>{{ getAreaNames(roles.areas) }}</td>


                  <td>

                    <button class="p-2 cursor-pointer" (click)="deleteRole(roles.roleName)">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path
                          d="M13.1966 4.94752V4.28771C13.1966 3.36388 13.1966 2.90196 13.0169 2.5491C12.8587 2.23872 12.6064 1.98637 12.296 1.82823C11.9431 1.64844 11.4812 1.64844 10.5574 1.64844H9.23774C8.31391 1.64844 7.85199 1.64844 7.49913 1.82823C7.18875 1.98637 6.9364 2.23872 6.77826 2.5491C6.59847 2.90196 6.59847 3.36388 6.59847 4.28771V4.94752M8.24801 9.48377V13.6076M11.5471 9.48377V13.6076M2.47461 4.94752H17.3205M15.671 4.94752V14.185C15.671 15.5707 15.671 16.2636 15.4013 16.7929C15.1641 17.2584 14.7855 17.637 14.32 17.8742C13.7907 18.1439 13.0978 18.1439 11.7121 18.1439H8.08306C6.69731 18.1439 6.00444 18.1439 5.47515 17.8742C5.00958 17.637 4.63106 17.2584 4.39384 16.7929C4.12415 16.2636 4.12415 15.5707 4.12415 14.185V4.94752"
                          stroke="#B42318" stroke-width="1.64954" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                    </button>

                    <p-dialog [(visible)]="showdeletePopup" header="Delete Role" [modal]="true"
                      [style]="{ width: '20vw' }" [closable]="true" [draggable]="false" [resizable]="false">

                      <app-delete-user [roleName]="selectedRole" (close)="showdeletePopup = false"
                        (deletedRole)="onGetAllRoles()"></app-delete-user>

                    </p-dialog>
                    <button class="p-2 cursor-pointer" (click)="openEdit(roles)">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path
                          d="M2.37265 14.9393C2.41054 14.5982 2.42949 14.4277 2.48108 14.2683C2.52686 14.1269 2.59154 13.9924 2.67336 13.8683C2.76558 13.7284 2.8869 13.6071 3.12953 13.3645L14.0217 2.47232C14.9327 1.56131 16.4098 1.56131 17.3208 2.47233C18.2318 3.38334 18.2318 4.8604 17.3208 5.77141L6.42862 16.6636C6.18598 16.9062 6.06467 17.0275 5.92481 17.1197C5.80073 17.2016 5.66617 17.2662 5.52476 17.312C5.36538 17.3636 5.19487 17.3826 4.85383 17.4205L2.0625 17.7306L2.37265 14.9393Z"
                          stroke="#475467" stroke-width="1.64954" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                    </button>

                    <p-dialog [(visible)]="showEditPopup" header="Edit Role Details" [modal]=" true"
                      [style]="{ width: '30vw',  }" [closable]="true" [draggable]="false" [resizable]="false">

                      <app-edit-user *ngIf="showEditPopup" [roleData]="selectedRoleData" (close)="showEditPopup = false"
                        (updated)="onGetAllRoles()"></app-edit-user>

                    </p-dialog>



                  </td>
                  <td>

                  </td>


                </tr>
              </ng-template>
            </p-table>
          </div>

        </p-tabpanel>

      </p-tabpanels>
    </p-tabs>
  </div>
</div>
