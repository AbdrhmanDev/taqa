<div class="bg-white rounded-xl shadow-sm p-6 mt-6 ms-3 me-3">
  <h1 class="font-bold text-2xl pb-4">Create Ticket</h1>
  <form class="space-y-6">


    <div class="grid grid-cols-12 gap-6">
      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Station

        </label>
        <p-select optionLabel="label" optionValue="value" placeholder="Select Factory" class="w-full">
        </p-select>
      </div>


      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Alert Type
        </label>
        <p-select optionLabel="label" optionValue="value" placeholder="Alert Issue" class="w-full">
        </p-select>
      </div>


      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1">Severity
        </label>
        <p-select optionLabel="label" optionValue="value" placeholder="Select Priority" class="w-full">
        </p-select>
      </div>

      <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Dateline
        </label>
        <p-datepicker placeholder="Date" [(ngModel)]="date" [ngModelOptions]="{standalone: true}"
          [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay" />
      </div>


    </div>

    <div class="mt-5 pt-4">
      <h3 class="font-bold text-black text-2xl">Assignment</h3>
      <p class="pt-3 pb-2">Select the engineer(s) to assign this ticket to.</p>
      <div class="col-span-12 md:col-span-3">
        <label class="block text-sm font-medium text-gray-800 mb-3 mt-3">
          Engineer
        </label>

        <div class="relative w-80">
          <!-- Icon -->
          <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none z-10">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 19 19" fill="none">
              <path
                d="M15.8094 16.6032C15.8094 15.5001 15.8094 14.9485 15.6733 14.4997C15.3667 13.4892 14.5759 12.6984 13.5654 12.3919C13.1166 12.2557 12.565 12.2557 11.4619 12.2557H7.50962C6.40649 12.2557 5.85492 12.2557 5.4061 12.3919C4.39558 12.6984 3.6048 13.4892 3.29826 14.4997C3.16211 14.9485 3.16211 15.5001 3.16211 16.6032M13.0428 5.93205C13.0428 7.89656 11.4503 9.48911 9.48576 9.48911C7.52125 9.48911 5.92871 7.89656 5.92871 5.93205C5.92871 3.96755 7.52125 2.375 9.48576 2.375C11.4503 2.375 13.0428 3.96755 13.0428 5.93205Z"
                stroke="#475467" stroke-width="1.58091" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>

          <!-- Select -->
          <p-select optionLabel="label" optionValue="value" placeholder="Engineer-name" class="w-full pl-10">
          </p-select>
        </div>
      </div>


      <div class="col-span-12 mt-3">
        <label class="block text-sm font-medium text-gray-800 mb-3 mt-3">Description</label>
        <p-editor [style]="{ height: '200px' }" placeholder="Details about user">
        </p-editor>
      </div>
      <div class="flex justify-between pt-4">
        <button type="button" class="px-5 py-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">
          Cancel
        </button>

        <button type="submit" class="px-6 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
          Create Ticket
        </button>
      </div>
    </div>
  </form>
</div>
