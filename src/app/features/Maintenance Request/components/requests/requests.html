<div class="">
  <div class="flex justify-end mt-4 ">
    <button [routerLink]="['/dashboard/create-ticket']" class="m-6 bg-indigo-700
             text-white font-medium py-2 px-4 rounded-lg transition cursor-pointer ">Create Ticket</button>
  </div>
  <div class="bg-white rounded-xl shadow-sm p-6 ms-3 me-3">
    <form class="space-y-6">


      <div class="grid grid-cols-12 gap-6">
        <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Type of
            alerts
          </label>
          <p-select optionLabel="label" optionValue="value" placeholder="All" class="w-full">
          </p-select>
        </div>


        <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Ticket ID
          </label>
          <p-select optionLabel="label" optionValue="value" placeholder="All" class="w-full">
          </p-select>
        </div>


        <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1">Status
          </label>
          <p-select optionLabel="label" optionValue="value" placeholder="All" class="w-full">
          </p-select>
        </div>

        <div class="col-span-12 md:col-span-3"> <label class="block text-sm font-medium text-gray-700 mb-1"> Date
          </label>
          <p-datepicker placeholder="Date" [(ngModel)]="date" [ngModelOptions]="{standalone: true}"
            [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay" />
        </div>


      </div>
    </form>
    <p-table class="mt-6" [value]="tickets" [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '50rem' }"
      [rowsPerPageOptions]="[5, 10, 20]">
      <ng-template #header>
        <tr class="">
          <th class="">Ticket_ID</th>
          <th>Station</th>
          <th>Date Create</th>
          <th>Throughput</th>
          <th>status</th>
          <th>Action</th>

        </tr>
      </ng-template>
      <ng-template #body let-ticket>
        <tr>
          <td>{{ ticket.Ticket_ID }}</td>
          <td>{{ ticket.Station }}</td>
          <td>{{ ticket.Date }}</td>
          <td>{{ ticket.Throughput }}</td>
          <td>{{ ticket.status }}</td>
          <td><button class="font-bold text-gray-400 px-2 py-1 rounded">delete</button>
            <button class="font-bold text-indigo-700 px-2 py-1 rounded">Edit</button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
