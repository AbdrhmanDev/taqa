<section class="flex h-screen overflow-hidden bg-gray-50">

  <div class="w-full md:w-1/2 flex items-center justify-center px-4">
    <div class="w-full max-w-[420px] bg-white rounded-2xl shadow-lg p-6 sm:p-8">
      <!-- Logo -->
      <div class="flex items-center justify-center mb-6">
        <img src="../../../../../assets/Images/Logo.png" class="w-56 sm:w-64 md:w-72" alt="Taqa Logo" />
      </div>

      <div class="mb-6 text-center">
        <h1 class="text-xl sm:text-2xl font-semibold text-gray-900">
          Sign in to your account
        </h1>
        <p class="text-sm text-gray-500 mt-1">
          Enter your details to login
        </p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="Login()" class="space-y-5">

        <div>
          <label for="Email" class="block text-sm font-medium text-gray-700 mb-1">
            Email
          </label>

          <div class="relative">

            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="16" viewBox="0 0 19 16" fill="none">
                <path
                  d="M4.86523 4.86719L7.31691 6.31671C8.74625 7.16179 9.31755 7.16179 10.7469 6.31671L13.1986 4.86719"
                  stroke="#625F6E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                <path
                  d="M0.712357 9.01224C0.766836 11.5668 0.794076 12.8442 1.73668 13.7903C2.67929 14.7365 3.99116 14.7695 6.61491 14.8354C8.23198 14.876 9.83313 14.876 11.4502 14.8354C14.0739 14.7695 15.3858 14.7365 16.3284 13.7903C17.271 12.8442 17.2983 11.5668 17.3527 9.01224C17.3703 8.19083 17.3703 7.37428 17.3527 6.55288C17.2983 3.99827 17.271 2.72096 16.3284 1.77477C15.3858 0.828578 14.0739 0.795616 11.4502 0.729693C9.83313 0.689063 8.23198 0.689061 6.6149 0.729687C3.99116 0.795605 2.67929 0.828564 1.73668 1.77476C0.794071 2.72095 0.766833 3.99826 0.712356 6.55287C0.694839 7.37427 0.69484 8.19083 0.712357 9.01224Z"
                  stroke="#625F6E" stroke-width="1.4" stroke-linejoin="round" />
              </svg>
            </span>


            <input formControlName="email" type="email" id="Email" placeholder="Enter your email" class="w-full rounded-lg border border-gray-300 pl-11 pr-4 py-2.5 text-sm
             focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Password
          </label>

          <div class="relative group">

            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none
             text-gray-400 ">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M13.6848 7.87471V6.08554C13.6848 3.99138 11.9865 2.29301 9.89232 2.29301C7.79815 2.28388 6.09315 3.97388 6.08398 6.06888V6.08554V7.87471"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M13.0685 17.7106H6.70102C4.95602 17.7106 3.54102 16.2964 3.54102 14.5506V10.9764C3.54102 9.23057 4.95602 7.81641 6.70102 7.81641H13.0685C14.8135 7.81641 16.2285 9.23057 16.2285 10.9764V14.5506C16.2285 16.2964 14.8135 17.7106 13.0685 17.7106Z"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M9.88477 11.8359V13.6868" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </span>

            <!-- Password Input -->
            <input formControlName="password" [type]="showPassword ? 'text' : 'password'" id="password" placeholder="Enter your password" class="w-full rounded-lg border border-gray-300
             pl-11 pr-11 py-2.5 text-sm
             focus:outline-none focus:ring-2 focus:ring-teal-500
             focus:border-transparent" />


            <button type="button" (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-teal-500">
              <!-- eye svg -->
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
                <circle cx="12" cy="12" r="3" />
                @if (showPassword) {
                  <line x1="2" y1="2" x2="22" y2="22" />
                }
              </svg>
            </button>
          </div>
        </div>



        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm">
          <label class="flex items-center gap-2 text-gray-600">
            <input type="checkbox" class="rounded border-gray-300 text-teal-600 focus:ring-teal-500" />
            Keep me logged in
          </label>

          <a routerLink="/email-verify" class="text-teal-600 hover:underline text-right">
            Forgot password?
          </a>

        </div>


        <button type="submit" [disabled]="isLoading" class="w-full bg-teal-500 hover:bg-teal-600
                 text-white font-medium py-3 rounded-lg transition flex items-center justify-center gap-2
                 disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:bg-teal-500">
          @if (isLoading) {
            <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25" />
              <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </svg>
            Signing in...
          } @else {
            Sign in
          }
        </button>
      </form>
    </div>
  </div>


  <div class="hidden md:block md:w-1/2">
    <img src="../../../../../assets/Images/master-gas-station.jpg" class="w-full h-full object-cover object-[35%_center]"
      alt="Master Gas station" />
  </div>
</section>
