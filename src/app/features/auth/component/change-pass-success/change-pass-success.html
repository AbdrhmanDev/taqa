<section class="flex h-screen overflow-hidden bg-gray-50">

  <div class="w-full md:w-1/2 flex items-center justify-center px-4">
    <div class="w-full max-w-[420px] bg-white rounded-2xl shadow-lg p-6 sm:p-8">
      <!-- Logo -->
      <div class="flex items-center justify-center mb-6">
        <img src="../../../../../assets/Images/Logo.png" class="w-56 sm:w-64 md:w-72" alt="Taqa Logo" />
      </div>

      <div class="mb-6 text-center">
        <h1 class="text-xl sm:text-2xl font-semibold text-gray-900">
          Your password successfully changed.
        </h1>
        <button class="w-full bg-teal-500 hover:bg-teal-600 mt-3

          login</button>

      </div>



    </div>
  </div>


  <div class="hidden md:block md:w-1/2">
    <img src="../../../../../assets/Images/auth-background.png" class="w-full h-full object-cover"
      alt="Auth background" />
  </div>
