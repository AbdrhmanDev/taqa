<div class="card">
  <p-dialog (onHide)="visibleChange.emit(false)" [modal]="true" [(visible)]="visible" [style]="{ width: '35rem' }"
    [showHeader]="false">

    <!-- Custom Header -->
    <div class="dialog-header p-4 flex justify-between items-center bg-gray-50 rounded-t-lg border-b border-gray-200">
      <div class="header-title flex items-center gap-2">
        <span class="warning-icon text-red-500">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </span>
        <span class="header-text font-bold text-gray-800 text-lg">Confirm Unlink</span>
      </div>
      <button class="close-btn text-gray-500 hover:text-gray-800" (click)="visibleChange.emit(false)">✕</button>
    </div>

    <div class="p-6">
      <!-- Red Info Card -->
      <div class="unlink-info-card mb-4 bg-red-50 p-4 border border-red-100 rounded-lg">
        <p class="unlink-warning-text text-red-600 text-sm mb-2">You are about to unlink this compressor.</p>
        <h2 class="dispenser-name font-bold text-gray-900 text-xl">{{compressor?.name || 'Unknown Compressor'}}</h2>
        <p class="dispenser-meta text-gray-600 text-sm">Model: {{compressor?.model || 'N/A'}}</p>
        <p class="dispenser-meta text-gray-600 text-sm">Status: {{compressor?.status || 'N/A'}}</p>
      </div>

      <!-- Yellow Warning Banner -->
      <div class="warning-banner mb-6 bg-yellow-50 p-3 rounded text-yellow-800 text-sm flex gap-2">
        <span class="warning-banner-icon">⚠️</span>
        <span>After unlinking, this compressor will become available for reassignment.</span>
      </div>

      <!-- Reason for Unlinking -->
      <div class="reason-section mb-6">
        <label class="reason-label block text-gray-700 text-sm font-semibold mb-2">
          Reason for Unlinking <span class="required-star text-red-500">*</span>
        </label>
        <textarea pInputTextarea placeholder="Enter reason for this configuration change" rows="4" class="reason-textarea w-full p-2 border border-gray-300 rounded"></textarea>
      </div>

      <!-- Footer Buttons -->
      <div class="flex justify-end gap-3">
        <button (click)="visibleChange.emit(false)" class="cancel-btn px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition">Cancel</button>
        <button (click)="confirmUnlink()" class="unlink-btn px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition">Confirm Unlink</button>
      </div>
    </div>
  </p-dialog>
</div>
