<div class="card">
  <p-dialog (onHide)="close()" header="Move Compressor to Asset" [modal]="true"
    [(visible)]="visible" [style]="{ width: '35rem' }">

    <!-- Compressor Info Card -->
    <div class="compressor-info-card mb-6 bg-gray-50 border border-gray-200 rounded p-4">
      <span class="moving-label text-sm text-gray-500 mb-1 block">Moving :</span>
      <h2 class="compressor-name font-bold text-lg text-gray-800">{{compressor?.name}}</h2>
      <p class="compressor-meta text-xs text-gray-600">Model: {{compressor?.model}}</p>
      <p class="compressor-meta text-xs text-gray-600">Linked Dispensers: {{compressor?.dispensersCount}}</p>
    </div>

    <!-- From → To Section -->
    <div class="station-transfer-row mb-4 flex items-center justify-between gap-4">
      <div class="station-field w-full">
        <label class="station-label block text-sm font-semibold mb-1 text-gray-700">From Station</label>
        <input pInputText [value]="currentStationName" disabled class="station-input disabled-input w-full p-2 border border-gray-200 rounded bg-gray-100" />
      </div>

      <span class="transfer-arrow text-xl mt-6 text-gray-400">→</span>

      <div class="station-field w-full">
        <label class="station-label block text-sm font-semibold mb-1 text-gray-700">To Asset</label>
        <p-select [options]="assets" [(ngModel)]="selectedAsset" optionLabel="name" placeholder="Select target asset"
          class="station-dropdown w-full" appendTo="body">
        </p-select>
      </div>
    </div>

    <!-- Note Banner -->
    <div class="note-banner mb-6 bg-blue-50 text-blue-800 text-sm p-3 rounded">
      <span>Note: This compressor will be unlinked from the current station and linked to the selected asset automatically.</span>
    </div>

    <!-- Reason for Move -->
    <div class="reason-section mb-6">
      <label class="reason-label block text-sm font-semibold text-gray-700 mb-1">
        Reason for move <span class="required-star text-red-500">*</span>
      </label>
      <textarea pInputTextarea placeholder="Enter reason for this configuration change" rows="4"
        class="reason-textarea w-full p-2 border border-gray-300 rounded">
      </textarea>
    </div>

    <!-- Footer Buttons -->
    <div class="flex justify-end gap-3 mt-4">
      <button severity="secondary" (click)="close()" class="cancel-btn px-4 py-2 border border-gray-300 rounded hover:bg-gray-50 transition">Cancel</button>
      <button (click)="moveCompressor()" [disabled]="!selectedAsset" class="move-btn px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 transition">Move</button>
    </div>

  </p-dialog>
</div>
