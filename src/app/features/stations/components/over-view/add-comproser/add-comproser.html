<p-dialog (onHide)="close()" header="Link Compressor" [modal]="true" [(visible)]="visible" [style]="{ width: '400px' }">
  <div class="flex flex-col gap-4 py-4">
    <p class="text-gray-600 text-sm">Select an available compressor from the inventory to link to this station.</p>
    
    <div class="flex flex-col gap-2">
      <label class="font-semibold text-gray-700 text-sm">Available Compressors <span class="text-red-500">*</span></label>
      <p-select [options]="availableCompressors" [(ngModel)]="selectedCompressor" optionLabel="name" placeholder="Select a compressor" styleClass="w-full" appendTo="body"></p-select>
    </div>
    
    <div *ngIf="selectedCompressor" class="mt-2 p-3 bg-blue-50 rounded border border-blue-100">
      <p class="text-sm font-medium text-blue-800">Serial: {{selectedCompressor.serialNumber}}</p>
      <p class="text-xs text-blue-600">Status: {{selectedCompressor.status}}</p>
    </div>
  </div>
  
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3 mt-2">
      <button (click)="close()" class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition font-medium">Cancel</button>
      <button (click)="confirmLink()" [disabled]="!selectedCompressor" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 transition font-medium">Link</button>
    </div>
  </ng-template>
</p-dialog>
