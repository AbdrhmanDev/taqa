<!-- Loading State -->
<div *ngIf="isLoading" class="m-3 bg-white p-6 rounded-3xl shadow-sm flex justify-center items-center min-h-40">
  <div class="flex flex-col items-center gap-3">
    <div class="w-10 h-10 border-4 border-gray-200 border-t-blue-900 rounded-full animate-spin"></div>
    <p class="text-gray-400 text-sm">Loading alarms...</p>
  </div>
</div>

<!-- Alarms Container -->
<div class="m-3 bg-white p-6 rounded-3xl shadow-sm h-[500px] flex flex-col">
  <h3 class="pb-2 font-bold">Recent Alarms</h3>

  <!-- Scrollable wrapper -->
  <div class="flex-1 overflow-y-auto flex flex-col gap-3 pr-1">

    <div class="bg-gray-100 p-4 rounded-3xl flex justify-between">
      <div class="flex">
        <div class="me-2 w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path
              d="M3.39309 6.61077C5.40449 3.05165 6.41019 1.2721 7.79022 0.814009C8.54943 0.561997 9.36724 0.561997 10.1264 0.814009C11.5065 1.2721 12.5122 3.05165 14.5236 6.61077C16.535 10.1699 17.5407 11.9494 17.239 13.3995C17.073 14.1972 16.6641 14.9207 16.0709 15.4664C14.9925 16.4583 12.9811 16.4583 8.95833 16.4583C4.93554 16.4583 2.92414 16.4583 1.8458 15.4664C1.25257 14.9207 0.843658 14.1972 0.677686 13.3995C0.375995 11.9494 1.38169 10.1699 3.39309 6.61077Z"
              stroke="#912018" stroke-width="1.25" />
            <path d="M8.95101 11.875H8.9585" stroke="#912018" stroke-width="1.66667" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M8.95898 9.375L8.95898 6.04167" stroke="#912018" stroke-width="1.25" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <div>
          <h4 class="font-bold">stationName</h4>
          <p class="text-gray-400 text-sm pt-2 pb-2">ClassName</p>
          <p class="font-bold">Name</p>
          <p class="text-gray-400 pt-2">Time Stamp</p>
        </div>
      </div>
      <div>
        <p class="text-center text-green-800 w-16 h-6 bg-green-100 rounded-xl mb-8">Normal</p>
        <a class="underline text-center text-blue-900 cursor-pointer pe-3">Acknowledge</a>
        <a class="underline text-center text-blue-900 cursor-pointer">Create Ticket</a>
      </div>
    </div>

    <!-- No data state -->
    <div class="text-center text-gray-400 py-6">
      No alarms yet...
    </div>

  </div>
</div>
