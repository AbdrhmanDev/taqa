<div class="w-80 cursor-pointer bg-gray-100 rounded-2xl p-5 shadow-sm border border-gray-200" (click)=" goToDetails()">

  <!-- Header -->
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">
      <!-- Icon -->
      <div class="w-8 h-8 flex items-center justify-center rounded-full bg-blue-100">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="13.5" r="2.25" stroke="#2D31A6" stroke-width="1.125" />
          <path d="M9 11.25V7.5" stroke="#2D31A6" stroke-width="1.125" stroke-linecap="round" />
          <path d="M16.5 9.75C16.5 5.60786 13.1421 2.25 9 2.25C4.85786 2.25 1.5 5.60786 1.5 9.75" stroke="#2D31A6"
            stroke-width="1.125" stroke-linecap="round" />
        </svg>
      </div>

      <h3 class="font-semibold text-gray-800">Compressor_01</h3>
    </div>

    <!-- Status -->
    <span class="px-3 py-1 text-sm rounded-full bg-green-100 text-green-700">
      Online
    </span>
  </div>

  <!-- Dispensers -->
  <div class="flex justify-between text-gray-700 mb-3">
    <span>Dispensers</span>
    <span class="text-gray-500">1/3</span>
  </div>

  <!-- Beacon Availability -->
  <div class="mb-4">
    <div class="flex justify-between text-sm text-gray-700 mb-1">
      <span>Beacon Availability</span>
      <span>85%</span>
    </div>

    <div class="w-full h-3 bg-gray-300 rounded-full overflow-hidden">
      <div class="h-full w-[85%] bg-gradient-to-r from-blue-500 to-green-500 rounded-full"></div>
    </div>
  </div>

  <!-- Last Read -->
  <p class="text-sm text-gray-500 mb-4">
    Last Beacon Read 09:29:30 2025-06-01
  </p>

  <!-- Performance -->
  <div>
    <div class="flex justify-between text-sm text-gray-700 mb-1">
      <span>Performance</span>
      <span>85%</span>
    </div>

    <div class="w-full h-3 bg-gray-300 rounded-full overflow-hidden">
      <div class="h-full w-[85%] bg-gradient-to-r from-blue-500 to-green-500 rounded-full"></div>
    </div>
  </div>

</div>
